name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - id: state
        run: |
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l)
          version=$(node -p "require('./package.json').version")
          published=$(npm view "archprint@$version" version 2>/dev/null || true)
          if [ "$pending" -eq 0 ] && [ "$published" = "$version" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - id: changesets
        uses: changesets/action@v2
        if: steps.state.outputs.skip != 'true'
        with:
          version-script: npm run version-packages
          publish-script: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to the MCP Registry
        if: steps.changesets.outputs.published == 'true' || steps.state.outputs.skip == 'true'
        env:
          MCP_PUBLISHER_VERSION: 1.8.1
        run: |
          status() { curl -s -o /dev/null -w '%{http_code}' --max-time "$2" "$1" || echo 000; }
          version=$(node -p "require('./package.json').version")
          name=$(node -p "require('./package.json').mcpName ?? ''")
          [ -n "$name" ] || { echo "package.json has no mcpName; cannot publish to the MCP Registry."; exit 1; }
          served=000
          for attempt in $(seq 1 60); do
            served=$(status "https://registry.npmjs.org/archprint/$version" 20)
            [ "$served" = "200" ] && break
            sleep 20
          done
          if [ "$served" != "200" ]; then
            echo "npm did not serve archprint@$version within 20 minutes. Wait until it does, then rerun."
            exit 1
          fi
          declared=$(curl -sSf --max-time 20 "https://registry.npmjs.org/archprint/$version" \
            | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).mcpName ?? ''")
          if [ "$declared" != "$name" ]; then
            echo "archprint@$version on npm declares mcpName '$declared', not $name; the MCP Registry would reject it."
            exit 1
          fi
          encoded=$(node -p "encodeURIComponent(process.argv[1])" -- "$name")
          listed=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 --retry 3 --retry-all-errors \
            --retry-max-time 300 "https://registry.modelcontextprotocol.io/v0.1/servers/$encoded/versions/$version" || echo 000)
          if [ "$listed" = "200" ]; then
            echo "$name $version is already in the MCP Registry."
            exit 0
          fi
          base="https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}"
          download="curl -sSfL --max-time 300 --retry 3 --retry-all-errors"
          $download -O "$base/mcp-publisher_linux_amd64.tar.gz"
          $download "$base/registry_${MCP_PUBLISHER_VERSION}_checksums.txt" \
            | grep ' mcp-publisher_linux_amd64.tar.gz$' | sha256sum -c -
          tar xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
