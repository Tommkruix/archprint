name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      # Dogfood: run the built CLI on Archprint's own code. Fails the build if a scan crashes on a
      # real repo, and the JSON is validated so the machine output stays well-formed.
      - run: node dist/cli.js scan . --json | node -e "JSON.parse(require('node:fs').readFileSync(0,'utf8'))"
